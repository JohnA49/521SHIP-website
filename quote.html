<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request a Quote | 521-SHIP</title>

    <link rel="stylesheet" href="css/style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
</head>

<body>

<header>

    <a href="index.html" class="logo-link">
        <img
            src="images/logo512.png"
            alt="521-SHIP"
            class="site-logo"
        >
    </a>

    <button
        class="menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="main-navigation">
        <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="main-nav" id="main-navigation">
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#how-it-works">How It Works</a>
        <a href="booking.html">Book Pickup</a>
        <a href="quote.html">Get Quote</a>
        <a href="index.html#contact">Contact</a>
    </nav>

</header>

    <main class="booking-page">

        <h2>Request a Shipping Quote</h2>

        <p>
            Tell us what you need shipped and we will contact you with pricing
            and next steps.
        </p>


        
      <form
    class="quote-form" action="https://formspree.io/f/mgavvdrb" method="POST">
    <input
        type="hidden"
        name="_subject"
        value="New 521-SHIP Quote Request"
    >

    <div class="quote-grid">

        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name"
                   placeholder="Your full name" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Your phone number" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="pickup">Pickup Location</label>
            <input type="text" id="pickup" name="pickup"
                   placeholder="City, State">
        </div>

        <div class="form-group">
            <label for="destination">Destination *</label>
            <input type="text" id="destination"
                   name="destination"
                   placeholder="City, Country" required>
        </div>

        <div class="form-group">
            <label for="quantity">Number of Items</label>
            <input type="number" id="quantity"
                   name="quantity" min="1"
                   placeholder="Approximate quantity">
        </div>

        <div class="form-group full-width">
            <label for="items">What Are You Shipping? *</label>
            <textarea id="items" name="items"
                      rows="4" required
                      placeholder="Describe your items, dimensions and approximate weight"></textarea>
        </div>

        <div class="form-group full-width">
            <label for="notes">Additional Details</label>
            <textarea id="notes" name="notes"
                      rows="3"
                      placeholder="Any special instructions or questions?"></textarea>
        </div>

    </div>

    <div class="quote-submit">
        <button type="submit" class="quote-button">
            Submit Quote Request
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

</form>

    </main>

    <footer>
        <p>&copy; 2026 521-SHIP. All rights reserved.</p>
    </footer>
<script src="js/main.js"></script>
</body>
</html>
